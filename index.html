<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Demo</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        #status {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 10;
            background: #000a;
            color: #fff;
            font: 14px sans-serif;
            padding: 6px 10px;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div id="status">Loading... allow camera</div>
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" stats
        gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="m" src="./assets/model.glb"></a-asset-item>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>
        <a-entity id="t" mindar-image-target="targetIndex: 0">
            <a-entity position="0 0 0.3" rotation="90 0 0" scale="0.12 0.12 0.12">
                <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear">
                    <a-gltf-model src="#m" position="-0.039 -0.559 4.393"></a-gltf-model>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>
    <script>
        var st = document.getElementById('status');
        var t = document.getElementById('t');
        t.addEventListener('targetFound', function () { st.textContent = 'Target found'; });
        t.addEventListener('targetLost', function () { st.textContent = 'Scanning...'; });
        document.querySelector('a-scene').addEventListener('arReady', function () { st.textContent = 'Scanning...'; });
    </script>
</body>

</html>
